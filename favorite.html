<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Favorites</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      background-color: #fce4ec;
      font-family: 'Poppins', sans-serif;
      padding: 20px;
    }
    h1 {
      text-align: center;
      color: #c2185b;
      margin-bottom: 30px;
    }
    .fav-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .fav-box {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      overflow: hidden;
      transition: transform 0.2s;
    }
    .fav-box:hover {
      transform: translateY(-5px);
    }
    .fav-box img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .fav-content {
      padding: 15px;
      text-align: center;
    }
    .fav-content h3 {
      margin: 10px 0;
      font-size: 1.1rem;
      color: #5c3d44;
    }
    .fav-content .price {
      font-size: 1rem;
      color: #c2185b;
      margin-bottom: 10px;
    }
    .remove-btn {
      padding: 8px 16px;
      background-color: #c2185b;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.3s;
    }
    .remove-btn:hover {
      background-color: #e91e63;
    }
    .empty-msg {
      text-align: center;
      color: #777;
      font-size: 1.2rem;
      margin-top: 50px;
    }
  </style>
</head>
<body>

  <h1>My Favorite Products ❤️</h1>

  <div class="fav-container" id="favContainer"></div>

  <script>
    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
    const container = document.getElementById("favContainer");

    function renderFavorites() {
      container.innerHTML = "";
      if (favorites.length === 0) {
        container.innerHTML = "<p class='empty-msg'>No favorite products yet.</p>";
        return;
      }
      favorites.forEach((product, index) => {
        container.innerHTML += `
          <div class="fav-box">
            <img src="${product.image}" alt="${product.name}">
            <div class="fav-content">
              <h3>${product.name}</h3>
              <div class="price">$${product.price}</div>
              <button class="remove-btn" onclick="removeFavorite(${index})">Remove</button>
            </div>
          </div>
        `;
      });
    }

    function removeFavorite(index) {
      favorites.splice(index, 1);
      localStorage.setItem("favorites", JSON.stringify(favorites));
      renderFavorites();
    }

    renderFavorites();
  </script>

</body>
</html>
