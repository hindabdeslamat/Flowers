<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Favorites</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .fav-container {
            max-width: 900px;
            margin: 50px auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .fav-box {
            background: #ffe4f1;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .fav-box img {
            width: 100%;
            height: 230px;
            object-fit: cover;
            border-radius: 10px;
        }
        .remove-btn {
            margin-top: 10px;
            display: inline-block;
            padding: 8px 15px;
            background: #ff5b9e;
            color: white;
            border-radius: 6px;
            cursor: pointer;
        }
        .remove-btn:hover {
            background: #d94b85;
        }
    </style>
</head>
<body>

<h1 style="text-align:center; margin-top:30px;">My Favorite Products ❤️</h1>

<div class="fav-container" id="favList"></div>

<script>
    let favorites = JSON.parse(localStorage.getItem("favorites")) || [];
    let favList = document.getElementById("favList");

    function displayFavorites() {
        favList.innerHTML = "";

        if (favorites.length === 0) {
            favList.innerHTML = "<h2 style='text-align:center;'>No favorite products yet 💔</h2>";
            return;
        }

        favorites.forEach((item, index) => {
            favList.innerHTML += `
                <div class="fav-box">
                    <img src="${item.image}" alt="">
                    <h3>${item.name}</h3>
                    <p>$${item.price}</p>
                    <button class="remove-btn" onclick="removeFav(${index})">Remove</button>
                </div>
            `;
        });
    }

    function removeFav(index) {
        favorites.splice(index, 1);
        localStorage.setItem("favorites", JSON.stringify(favorites));
        displayFavorites();
    }

    displayFavorites();
</script>

</body>
</html>
